# SINIF: GENEL — projeden bağımsız, değiştirmeden kopyalanır
name: Hat süpürücü

# Olay tabanlı bir hat, tek bir kaçırılan tetikleyicide sessizce durur ve işi
# insana elle itmek kalır. Bu süpürücü hattı ileri iter: her turda takılmış
# issue'ları bulup eksik adımı yeniden tetikler. Hiçbir iş, bir olayın
# düşmesi yüzünden beklemez.

# TETİKLEME: OLAY ÖNCE, ZAMANLAMA YEDEK. (#525, 4 Eylül)
#
# `*/15` günde 96 koşu ister; GitHub sekiz gün boyunca **günde ~6** verdi.
# Sık cron'u platform bastırıyor ve bunun bedeli 2-4 Eylül'de ödendi: sentez
# kırıkken süpürücü onu ilerletemedi, her issue'nun beş deneme hakkı yandı ve
# dokuz iş kalıcı olarak bırakılmış duruma düştü.
#
# Sık zamanlamayı daha da sıklaştırmak çare değil — bastırılan tam olarak o.
# Bu yüzden iş **olayla** geliyor, zamanlama yalnız hiç olay üretmeyen
# sıkışmalar için arkada duruyor. Saatlik cron, `*/15`'ten daha az bastırılıyor
# ve yedek olarak yeterli: burada kaçırılan hiçbir şey kaybolmuyor, yalnız
# geç kalıyor.
#
# Seçilen olaylar, işin **yapılabilir hâle geldiği** anlar:
#   issues.labeled    — hattın bir aşamayı bitirip etiketi ilerlettiği an
#   issues.reopened   — kapanmış bir işin geri döndüğü an
#   pull_request.closed — birleşen PR'ın arkasındaki işi serbest bıraktığı an
#
# `workflow_run` BİLEREK YOK. Süpürücü kendi tetiklediği iş akışlarının
# bitişinde uyanırsa, düşen bir iş akışı süpürücü→tetikle→düş→süpürücü
# döngüsü doğurur; bugünkü arıza tam da bunu saniyeler içinde 55 koşuya
# çevirirdi. Eşzamanlılık grubu yığılmayı kesiyor ama döngünün kendisini
# kesmiyor.
#
# Erken uyanmak bedava: aşağıdaki yaş kapıları (3 ve 5 dakika) genç işi zaten
# atlıyor, yani olay yağmuru boşa iş üretmiyor.
# **Bu dosya merkezde ve `workflow_call` ile çağrılıyor.**
#
# Tetikleyici çağıran deponun sarmalayıcısında duruyor; burada yalnız iş var.
# Sebebi tek kopya: bu hattı birden çok proje kullanıyor ve doktrin bir
# projede değişip ötekilerde eskimemeli.
#
# Çağıran bağlam olduğu gibi korunuyor — `github.repository`, `github.event`,
# `github.event_name`, `vars.*` ve `secrets: inherit` ile gelen anahtarlar
# hepsi **çağıran deponun** değerleri.
on:
  workflow_call:

permissions:
  contents: read
  issues: write
  actions: write

# **Eşzamanlılık burada değil, çağıranda.**
#
# Grup adı iki tarafta da aynı olduğunda çağıran grubu tutuyor, çağrılan
# aynı grubu istiyor ve kendi kendini bekleyip düşüyor — iş hiç başlamıyor,
# job listesi boş kalıyor ve hata mesajı da görünmüyor. Ölçüldü (12 Eylül,
# `maliyet` ve `pr-check` koşularında); eşzamanlılığı yalnız sarmalayıcıda
# bırakmak sorunu kapatıyor.
#
# Doğrusu da bu: aynı anda kaç tur koşacağı çağıran projenin kararı.

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reusable workflow'daki checkout ÇAĞIRAN depoyu indirir; betikler
      # (llm.sh, kaynak-sec.mjs, …) merkezde durur ve çağıranda yoktur.
      # İkinci checkout merkezi `hat/` altına, bu iş akışının çağrıldığı
      # commit'ten indirir: `job_workflow_sha` etiket ne ise odur, yani betik
      # ile iş akışı hiçbir zaman ayrı sürümden koşmaz. Depo public; jeton yok.
      #
      # Bu adım düşerse iş burada ölür ve sonraki adımlar hiç koşmaz: PR'a
      # durum yazılmaz, yorum düşmez. Bu istenen davranış — boş statü "hüküm
      # yok" diye okunur (toplu-pr bekler, kırmızıya çevirmez); yarım bir
      # kurulumla yazılmış yanlış bir hüküm ise kapıdan geçerdi.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aftermathy/hat-doktrini
          ref: ${{ github.job_workflow_sha }}
          path: hat
          persist-credentials: false
          # Yalnız betikler iner: merkezin tamamı (belgeler, skill'ler) bu işin
          # ihtiyacı değil ve indirilmeyen bayt en ucuz bayttır.
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Takılanları ilerlet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          source hat/.github/scripts/kota-kapisi.sh

          # Kota duvarına çarpan kol işini yapamaz ama koşuyu da devirmez:
          # öteki kollar hâlâ itebilir ve süpürücünün tek işi itmektir. Yine de
          # koşu yeşil bitmez — bayrak sonda okunuyor. Eskiden düşen bir liste
          # sorgusu boş listeye dönüşüyor, döngü hiç dönmüyor ve adım "yapacak
          # iş yoktu" diye yeşil bitiyordu; oysa bakılmamıştı. Boş liste ile
          # düşmüş liste ayrı şeyler (#557).
          KOTA_DUVARI=0

          # 0) **Etiketsiz issue = kimsenin bakmadığı issue.**
          #
          # Hattın her kolu bir etikete bakıyor: triyaj `taslak`, süpürücü
          # `taslak`/`kusurlu`/`internal-check`, mühendis `agent-ready`.
          # Hiçbiri "etiketi olmayan"a bakmıyordu — yani akışın girişinde
          # sessiz bir kör nokta vardı ve içine tam da ajanların kendi açtığı
          # arıza raporları düşüyordu: `agent-ready` otomasyondan geçmediği
          # için mühendis onları **etiketsiz** açıyor, ve etiketsiz açılan iş
          # kimseyi uyandırmıyor. Ölçüldü: #385 ve #390 iki gün boyunca
          # hiçbir kolun görmediği yerde durdu; sahip elle fark etti.
          #
          # Süpürücü karar vermiyor — yalnızca işi akışın **girişine** koyuyor.
          # `taslak` hattın kapısıdır ve oradan sonrası zaten yazılı.
          # Yaş listeden okunuyor, issue başına ayrı bir `gh issue view` ile
          # değil: `createdAt` zaten aynı GraphQL düğümünün alanı ve liste
          # sorgusu her hâlükârda atılıyor. Süpürücü çeyrek saatte bir koştuğu
          # için issue başına tasarruf edilen her çağrı günde 96 ile çarpılıyor
          # (#557).
          if ! ETIKETSIZ=$(gh issue list --state open --limit 100 --json number,labels,createdAt \
                       --jq '.[] | select(.labels | length == 0) | "\(.number),\(.createdAt)"' 2>/tmp/gh-hata); then
            kota_kapisi "$(cat /tmp/gh-hata 2>/dev/null)" "Hat süpürücü · etiketsiz" \
              || echo "etiketsiz issue listesi alınamadı — bu kol koşmadı."
            KOTA_DUVARI=1
            ETIKETSIZ=""
          fi
          for SATIR in $ETIKETSIZ; do
            N=${SATIR%%,*}
            YAS=$(( ( $(date +%s) - $(date -d "${SATIR#*,}" +%s) ) / 60 ))
            [ "$YAS" -lt 3 ] && continue   # açan taraf etiketi koyuyor olabilir
            echo "etiketsiz #$N akışa alınıyor"
            gh issue comment "$N" --body "**Süpürücü:** bu issue etiketsiz açılmıştı ve hattın hiçbir kolu etiketsize bakmıyor. \\`taslak\\` ile akışın girişine alındı; buradan sonrası triyajın işi." >/dev/null 2>&1 || true
            gh issue edit "$N" --add-label taslak >/dev/null 2>&1 || true
            sleep 2
          done

          # 1) `taslak` durup şartnameye çevrilmemiş: triyaj koşusu düşmüş
          #    demektir (kota, ağ, atlanan tetik). Etiket olayını yeniden üret.
          if ! TASLAKLAR=$(gh issue list --label taslak --state open --json number,updatedAt \
                       --jq '.[] | "\(.number),\(.updatedAt)"' 2>/tmp/gh-hata); then
            kota_kapisi "$(cat /tmp/gh-hata 2>/dev/null)" "Hat süpürücü · taslak" \
              || echo "taslak listesi alınamadı — bu kol koşmadı."
            KOTA_DUVARI=1
            TASLAKLAR=""
          fi
          for SATIR in $TASLAKLAR; do
            N=${SATIR%%,*}
            # Triyaj bittiğinde etiketi kendisi düşürür; hâlâ duruyorsa bitmemiştir.
            YAS=$(( ( $(date +%s) - $(date -d "${SATIR#*,}" +%s) ) / 60 ))
            [ "$YAS" -lt 5 ] && continue   # koşu hâlâ sürüyor olabilir

            # Sonsuz itiş yok: aynı issue defalarca itilip hâlâ ilerlemiyorsa
            # arıza o issue'da ya da bir adımda demektir. Çeyrek saatte bir
            # yeniden denemek onu düzeltmez, yalnızca kota yakar. Beşinci
            # denemeden sonra süpürücü susar ve sahibe görünür bir not bırakır.
            DENEME=$(gh issue view "$N" --json comments \
              --jq '[.comments[] | select(.body | startswith("**Süpürücü:**"))] | length')
            if [ "$DENEME" -ge 5 ]; then
              echo "taslak #$N: beş denemede ilerlemedi, bırakılıyor"
              continue
            fi
            gh issue comment "$N" --body "**Süpürücü:** triyaj yeniden tetikleniyor (deneme $((DENEME + 1))/5). Beşinci denemeden sonra bu issue bırakılır ve elle bakılması gerekir." >/dev/null 2>&1 || true
            echo "taslak #$N ilerletiliyor (${YAS}dk)"
            gh workflow run "Gemini triyaj" -f issue="$N" >/dev/null 2>&1 || true
            sleep 3
          done

          # 1a) Düşmüş LLM koşularını yeniden dene.
          #
          # `llm.sh` bir sağlayıcı düştüğünde "iş ertelendi — süpürücü yeniden
          # deneyecek" diyor. Bu söz yalnızca etiketle ilerleyen adımlar için
          # tutuluyordu; revizyon etiketle ilerlemiyor, bir yoruma cevap
          # veriyor (#282). `gh run rerun` seçildi: issue numarasını çözmeye
          # gerek yok, koşu kendi olay bağlamıyla yeniden koşar.
          #
          # **Tamamı `|| true` ile sarılı ve alt kabukta.** Bu adım bir
          # kolaylıktır, hattın kendisi değil: içindeki bir hata süpürücünün
          # asıl işini (taslakları ve iç kontrolü itmek) düşürmemeli.
          # 2026-08-19'da tam olarak bu oldu — kurtarma adımı kurtaracağı
          # hattı devirdi.
          (
            set +e
            SINIR=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M)
            for W in "Gemini revizyon" "Gemini sentez" "Gemini triyaj" "Gemini PM" "İç kontrol"; do
              IDLER=$(gh run list --workflow "$W" --limit 30 --json databaseId,conclusion,createdAt,attempt 2>/dev/null \
                | jq -r --arg s "$SINIR" '[.[] | select(.conclusion=="failure") | select(.createdAt > $s) | select(.attempt < 2)] | .[].databaseId' 2>/dev/null)
              for ID in $IDLER; do
                echo "düşen koşu $ID ($W) yeniden deneniyor"
                gh run rerun "$ID" --failed >/dev/null 2>&1
                sleep 2
              done
            done
          ) || true

          # 1b) `kusurlu`: onaylanmış bir şartname sonradan kusurlu bulundu.
          #     Onaya kadar gelen bir iş, kusuru işi yapacak ajan görene kadar
          #     fark edilmeyebilir — kesik inmiş bir gövde, karşılanmamış bir
          #     itiraz, çelişen iki madde. Böyle bir işi kuyrukta çakılı
          #     bırakmak hattın tıkanmasıdır: mühendis alamaz, kimse geri
          #     gönderemez, sahibi de bunu ancak kuyruk büyüyünce görür.
          #
          #     Bu yüzden geri dönüş yolu bir etikettir ve onu HERKES koyabilir:
          #     mühendis, mimar, süpürücü, sahip. Etiketi gören süpürücü işi
          #     iç kontrole geri indirir. `agent-ready` düşer — kapı yeniden
          #     sahibin onayından geçmeden açılmaz.
          if ! KUSURLULAR=$(gh issue list --label kusurlu --state open --json number --jq '.[].number' 2>/tmp/gh-hata); then
            kota_kapisi "$(cat /tmp/gh-hata 2>/dev/null)" "Hat süpürücü · kusurlu" \
              || echo "kusurlu listesi alınamadı — bu kol koşmadı."
            KOTA_DUVARI=1
            KUSURLULAR=""
          fi
          for N in $KUSURLULAR; do
            # Sayaç bu kolda da var: #309 21 Ağustos'ta tavansız beş tur döndü.
            # Üçüncü turdan sonra etiket düşer, iş sahibe bırakılır.
            KUSUR_TUR=$(gh issue view "$N" --json comments \
              --jq '[.comments[] | select(.body | startswith("**Süpürücü:** `kusurlu`"))] | length')
            if [ "$KUSUR_TUR" -ge 3 ]; then
              echo "kusurlu #$N: üç turda düzelmedi, sahibe bırakılıyor"
              gh issue edit "$N" --remove-label kusurlu --add-label sende >/dev/null 2>&1 || true
              gh issue comment "$N" --body "**Süpürücü:** bu şartname üç kez \`kusurlu\` ile geri döndü ve hâlâ düzelmedi. Döngü kesildi; \`sende\` etiketiyle sahibe bırakıldı. Kusurun kendisi hattın çözemediği bir çelişki olabilir." >/dev/null 2>&1 || true
              continue
            fi
            echo "kusurlu #$N: şartname revizyona geri gönderiliyor (tur $((KUSUR_TUR + 1))/3)"
            gh issue edit "$N" --remove-label kusurlu --remove-label agent-ready \
              --remove-label needs-approval --add-label internal-check >/dev/null 2>&1 || true
            gh issue comment "$N" --body "**Süpürücü:** \`kusurlu\` etiketiyle revizyona geri alındı. \`agent-ready\` düştü; şartname yeniden denetimden ve sentezden geçecek, sonra sahibin onayına dönecek. Kusurun ne olduğu yukarıdaki yorumda yazılı olmalı — yazılı değilse revizyon onu göremez." >/dev/null 2>&1 || true
            gh workflow run "İç kontrol" -f issue="$N" >/dev/null 2>&1 || true
            sleep 3
          done

          # 2) `internal-check` durup denetim yorumu eksik: denetçileri çağır.
          #    İkisi de düştüyse sentez çağrılır — sentez etiketi düşürür.
          if ! DENETIMDEKILER=$(gh issue list --label internal-check --state open --json number,updatedAt \
                       --jq '.[] | "\(.number),\(.updatedAt)"' 2>/tmp/gh-hata); then
            kota_kapisi "$(cat /tmp/gh-hata 2>/dev/null)" "Hat süpürücü · iç kontrol" \
              || echo "internal-check listesi alınamadı — bu kol koşmadı."
            KOTA_DUVARI=1
            DENETIMDEKILER=""
          fi
          for SATIR in $DENETIMDEKILER; do
            N=${SATIR%%,*}
            # Yaş ve sayaç `taslak` kolunda vardı, burada yoktu: bu kol
            # sonsuza kadar itiyordu. Sayacı bir kola koyup ötekine koymamak,
            # o kolu çıkışsız döngüye açık bırakır.
            YAS=$(( ( $(date +%s) - $(date -d "${SATIR#*,}" +%s) ) / 60 ))
            [ "$YAS" -lt 5 ] && continue

            # **Yorumlar bir kez çekiliyor, iki kez değil.** Bu kol aynı
            # `--json comments` sorgusunu arka arkaya iki kez atıyordu: biri
            # deneme sayacı, öteki denetim yorumlarını okumak için. İkisi de
            # aynı diziyi istiyor. Bu issue'nun kendisinde (#557) yorum sayısı
            # bir ara 129'a çıktı; aynı diziyi çeyrek saatte bir iki kez
            # istemek, kotayı ikiye katlamanın en sessiz yoluydu.
            #
            # Düşen sorgu boş diziden ayrılıyor: boş dizi "hiç yorum yok"
            # demek ve sayaç sıfırdan başlar; düşen sorgu ise hiçbir şey
            # bilmiyor demek ve bu issue bu turda atlanmalı — yoksa sayaç
            # sıfır okunur ve tavan hiç dolmaz.
            # Başlık ve gövde de AYNI çağrıda geliyor: parmak izi ikisini de
            # istiyor ve ayrı bir sorgu, yukarıdaki "bir kez çek" kuralını
            # ikinci bir kapıdan delerdi.
            if ! PAKET=$(gh issue view "$N" --json title,body,comments); then
              echo "internal-check #$N: yorumlar okunamadı, bu turda atlandı"
              continue
            fi
            YORUMLAR=$(printf '%s' "$PAKET" | jq '[.comments[].body]')

            # Parmak izi `internal-check.yml` ve `gemini-synthesis.yml` ile
            # aynı dizeyi üretmek zorunda: başlık + gövde + yorumlardaki
            # görsel adresleri.
            PARMAK=$({
              printf '%s' "$PAKET" | jq -r '.title, .body'
              printf '%s' "$PAKET" | jq -r '.comments[].body' \
                | grep -oE 'https://[^ )"]+\.(png|jpe?g|webp)' || true
            } | sha256sum | cut -c1-16)

            # SAYAÇ SÜRÜM BAŞINA. Kümülatif sayaç, kök sebebi denemeyle
            # düzelmeyen bir arızada her işi KALICI olarak öldürüyor: beş
            # deneme yanar, issue bırakılır ve arıza giderilse bile hiçbir tur
            # ona bir daha dokunmaz. 2-4 Eylül'de tam olarak bu oldu — sentez
            # `gh --jq` çakışmasıyla kırıktı (commit defc6f7), süpürücü onu
            # ilerletmeye çalışırken dokuz issue'nun beşer hakkını yaktı ve
            # dokuzu da elle kurtarılmak zorunda kaldı.
            #
            # Parmak izi bunu çözüyor: sayaç yalnızca ŞU ANKİ şartname
            # sürümünün denemelerini sayıyor. Şartname değişirse sayaç
            # sıfırlanır — ki doğrusu da bu, yeni sürüm eskinin borcunu
            # devralmaz. Kök sebep düzeltilip şartname aynı kalırsa sayaç
            # dolu kalmaya devam eder; o durumda elle kurtarma gerekir ve
            # gerekmesi doğrudur: beş kez denenip ilerlemeyen bir iş, arıza
            # giderilmiş olsa bile bakılmayı hak ediyor.
            #
            # Aynı düzeltme kapı sayacına 2 Eylül'de yapılmıştı (984934c);
            # süpürücünün sayacı o turda gözden kaçtı.
            #
            # Parmaksız eski yorumlar hiçbir sürüme sayılmıyor: hangi sürümün
            # borcu oldukları okunamıyor.
            DENEME=$(printf '%s' "$YORUMLAR" \
              | jq --arg p "parmak:$PARMAK" \
                '[.[] | select(startswith("**Süpürücü:** iç kontrol"))
                      | select(contains($p))] | length')
            if [ "$DENEME" -ge 5 ]; then
              echo "internal-check #$N: bu sürümü ($PARMAK) beş kez denendi, bırakılıyor"
              continue
            fi

            # HATA YORUMU İLERLEME SAYILMAZ. "Denetim yapılamadı" dolu bir
            # yorumdur; varlığını saymak, çağrı hiç başarılı olmamışken
            # sentezi tetiklemek demekti — sentez kapıya çarpıp iç kontrolü
            # geri çağırıyor ve döngü kapanmıyordu.
            #
            # VE YORUM ŞU ANKİ SÜRÜME AİT OLMALI. Sayım yalnızca "başarılı
            # denetim var mı" diye baktığında, revizyondan sonra eski sürümün
            # yorumu sentezi tetikliyordu — sentez de aynı körlükle onu onay
            # sayıp şartnameyi denetlenmemiş hâlde onaya gönderiyordu (#628,
            # 1 Eylül). Parmak izi zaten yorumun altında duruyordu;
            # karşılaştırılmıyordu.
            SAYAN='[.[] | select(startswith("%s")) | select(contains("parmak:'"$PARMAK"'")) | select(test("Bu denetim yarım kaldı|Denetim yapılamadı") | not)] | length'
            M=$(echo "$YORUMLAR" | jq "$(printf "$SAYAN" '**Mühendis-check:**')")
            A=$(echo "$YORUMLAR" | jq "$(printf "$SAYAN" '**Mimar-check:**')")
            if [ "$M" -ge 1 ] && [ "$A" -ge 1 ]; then
              # Bu dal da sayılır: sentez düşüp `internal-check` etiketini
              # bıraktığında sayaçsız bir dal sonsuza kadar iter.
              echo "#$N: iki denetim de başarılı → sentez (deneme $((DENEME + 1))/5)"
              gh issue comment "$N" --body "**Süpürücü:** iç kontrol tamam, sentez yeniden tetikleniyor (deneme $((DENEME + 1))/5, parmak:$PARMAK). Beşinci denemeden sonra bu issue bırakılır ve elle bakılması gerekir." >/dev/null 2>&1 || true
              gh workflow run "Gemini sentez" -f issue="$N" >/dev/null 2>&1 || true
            else
              echo "#$N: bu sürümün ($PARMAK) denetimi eksik (mühendis=$M mimar=$A) → iç kontrol (deneme $((DENEME + 1))/5)"
              gh issue comment "$N" --body "**Süpürücü:** iç kontrol yeniden tetikleniyor (deneme $((DENEME + 1))/5, parmak:$PARMAK). Beşinci denemeden sonra bu issue bırakılır ve elle bakılması gerekir." >/dev/null 2>&1 || true
              gh workflow run "İç kontrol" -f issue="$N" >/dev/null 2>&1 || true
            fi
            sleep 3
          done

          # Hüküm sonda: hangi kolun düştüğü yukarıda annotation ve özet olarak
          # yazılı, burada yalnızca koşunun rengi belirleniyor.
          if [ "$KOTA_DUVARI" = "1" ]; then
            echo "En az bir kol kota duvarına çarptı — koşu yeşil bitmiyor."
            exit 1
          fi
