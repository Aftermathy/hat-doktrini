# SINIF: GENEL — projeden bağımsız, değiştirmeden kopyalanır
name: Issue süpürücü

# PR main'e birleştiği anda, kapattığı issue'ları kapatır. LLM yok — bu iş
# tamamen mekaniktir ve beklememelidir.
#
# GitHub `Closes #N`'i yalnızca doğrudan main'e birleşen PR'da işler.
# Yığınlanmış PR'lar (base'i başka bir dal) birleştiğinde issue açık kalır;
# iş main'e ancak üstteki dal birleşince ulaşır. Bu süpürücü o boşluğu
# kapatır: main'e inen dalın altında birleşmiş çocuk PR'ları da gezer ve
# onların issue'larını da kapatır.

# **Bu dosya merkezde ve `workflow_call` ile çağrılıyor.**
#
# Tetikleyici çağıran deponun sarmalayıcısında duruyor; burada yalnız iş var.
# Sebebi tek kopya: bu hattı birden çok proje kullanıyor ve doktrin bir
# projede değişip ötekilerde eskimemeli.
#
# Çağıran bağlam olduğu gibi korunuyor — `github.repository`, `github.event`,
# `github.event_name`, `vars.*` ve `secrets: inherit` ile gelen anahtarlar
# hepsi **çağıran deponun** değerleri.
on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sweep:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Birleşen yığındaki issue'ları kapat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          extract() {
            # Yalnızca kapatma anahtar sözcükleri ve dal adı kuralı; "ilgili: #N"
            # gibi geçici atıflar issue kapatmamalı.
            { printf '%s\n' "$1" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' || true
              printf '%s\n' "$2" | grep -oE '^issue-[0-9]+' | grep -oE '[0-9]+' || true
            }
          }

          NUMS=$(extract "$PR_BODY" "$HEAD_REF")

          # Bu dala birleşmiş çocuk PR'lar — onların işi de şimdi main'e ulaştı.
          # Derinlik sınırlı BFS: yığınlar pratikte kısadır, döngü koruması şart.
          QUEUE="$HEAD_REF"
          DEPTH=0
          while [ -n "$QUEUE" ] && [ "$DEPTH" -lt 5 ]; do
            NEXT=""
            for BR in $QUEUE; do
              CHILDREN=$(gh pr list --state merged --base "$BR" \
                --json number,body,headRefName \
                --jq '.[] | "\(.number)\t\(.headRefName)\t\(.body // "" | gsub("\n"; " "))"' || true)
              [ -z "$CHILDREN" ] && continue
              while IFS=$'\t' read -r CNUM CHEAD CBODY; do
                [ -z "$CNUM" ] && continue
                NUMS="$NUMS
          $(extract "$CBODY" "$CHEAD")"
                NEXT="$NEXT $CHEAD"
              done <<EOF2
          $CHILDREN
          EOF2
            done
            QUEUE="$NEXT"
            DEPTH=$((DEPTH + 1))
          done

          for N in $(printf '%s\n' "$NUMS" | grep -E '^[0-9]+$' | sort -un); do
            STATE=$(gh issue view "$N" --json state -q .state 2>/dev/null || echo "YOK")
            if [ "$STATE" = "OPEN" ]; then
              gh issue close "$N" --comment "PR #${PR_NUM} main'e birleşti; bu işin kodu artık ana dalda. Otomatik kapatıldı — kapsamdan eksik kalan varsa yeniden açıp yorumla belirt." \
                && echo "kapatıldı: #$N"
            else
              echo "atlandı: #$N ($STATE)"
            fi
          done
