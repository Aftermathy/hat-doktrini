# Sarmalayıcı — iş `Aftermathy/hat-doktrini`de.
#
# Bu dosya `hat-doktrini/sarmalayicilar/` altından kopyalandı.
#
# Bu dosya yalnız tetikleyiciyi ve izinleri taşıyor; iş akışının kendisi
# merkezde ve birden çok proje onu paylaşıyor. Merkez değişince buraya
# dokunmak gerekmiyor — sürüm etiketi (`@v1`) yükseltilene kadar bu proje
# aynı sürümde kalıyor.
#
# Tetikleyici burada durmak zorunda: GitHub `workflow_call` ile çağrılan
# dosyanın kendi tetikleyicisini okumuyor.
name: Denetçi

on:
  # SADECE ELLE. Otomatik tetikleyici yok ve bu bir eksiklik değil, karar.
  #
  # Ölçüldü: bir denetim ortalama 23.000 çıktı token'ı harcıyor ve neredeyse
  # tamamı düşünme bloklarından geliyor — yani PR başına $0.35-0.40. Hattın
  # hızında bu, meşgul bir oturumda saatte $5 demek. 21 Ağustos'ta iki kez,
  # toplam ~$12 böyle gitti.
  #
  # İlk seferinde suç tetikleyicideydi (`synchronize`, iki saatte 41 koşu).
  # İkinci seferinde tetikleyici düzeltilmişti ve para yine gitti: kusur
  # kalmamıştı, fiyat oradaydı. Bir aracın kendisi pahalıysa onu ayarlayarak
  # ucuzlatamazsın, ne zaman çağıracağına karar edersin.
  #
  # Rutin denetim CodeRabbit'te. Copilot 22 Ağustos'ta rutinden çıktı:
  # kod incelemesinin premium istek çarpanı 13 olunca Pro+ bile dört gün
  # gidiyor ve kota sonrası inceleme başına $0.52 ediyor — bu denetçiden de
  # hattın gününden de pahalı (bkz.
  # docs/notes/2026-08-22-copilot-inceleme-fiyati-hattin-uzerinde.md).
  # Bu denetçi, bedeli parayla ölçülmeyen farklar için: migration, RLS, para
  # aritmetiği, yetki. Onu da insan çağırır.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR numarası'
        required: true


permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: denetci-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  cagir:
    uses: Aftermathy/hat-doktrini/.github/workflows/denetci.yml@v1
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit
