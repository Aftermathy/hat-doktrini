# Sarmalayıcı — iş `Aftermathy/hat-doktrini`de.
#
# Bu dosya `hat-doktrini/sarmalayicilar/` altından kopyalandı.
#
# Bu dosya yalnız tetikleyiciyi ve izinleri taşıyor; iş akışının kendisi
# merkezde ve birden çok proje onu paylaşıyor. Merkez değişince buraya
# dokunmak gerekmiyor — sürüm etiketi (`@v1`) yükseltilene kadar bu proje
# aynı sürümde kalıyor.
#
# Tetikleyici burada durmak zorunda: GitHub `workflow_call` ile çağrılan
# dosyanın kendi tetikleyicisini okumuyor.
name: Gemini PM

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  push:
    branches: [main]
    paths:
      - 'docs/ENGINEERING-NOTES.md'
      - 'docs/ROADMAP.md'
      - 'docs/PRODUCT-DNA.md'
  schedule:
    # Hiçbir olay olmasa bile günde bir kez bakar.
    - cron: '0 6 * * *'
  workflow_dispatch:

# İki koşu aynı anda çalışırsa hiçbiri diğerinin açtığı issue'yu göremez ve
# aynı iş iki kez açılır. Sıraya alınır, iptal edilmez — her tetikleyicinin
# gördüğü durum farklıdır.

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: gemini-pm
  cancel-in-progress: true

jobs:
  cagir:
    uses: Aftermathy/hat-doktrini/.github/workflows/gemini-pm.yml@v1
    secrets: inherit
