# Sarmalayıcı — iş `Aftermathy/hat-doktrini`de.
#
# Bu dosya `hat-doktrini/sarmalayicilar/` altından kopyalandı.
#
# Bu dosya yalnız tetikleyiciyi ve izinleri taşıyor; iş akışının kendisi
# merkezde ve birden çok proje onu paylaşıyor. Merkez değişince buraya
# dokunmak gerekmiyor — sürüm etiketi (`@v1`) yükseltilene kadar bu proje
# aynı sürümde kalıyor.
#
# Tetikleyici burada durmak zorunda: GitHub `workflow_call` ile çağrılan
# dosyanın kendi tetikleyicisini okumuyor.
name: İç kontrol

on:
  issues:
    types: [labeled]
  # Botun (GITHUB_TOKEN) koyduğu etiket olay doğurmaz; triyaj ve PM bu yüzden
  # etiketin yanında bir de dispatch atar.
  workflow_dispatch:
    inputs:
      issue:
        description: "Denetlenecek issue numarası"
        required: true


permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: internal-check-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cagir:
    uses: Aftermathy/hat-doktrini/.github/workflows/internal-check.yml@v1
    with:
      issue: ${{ inputs.issue }}
    secrets: inherit
