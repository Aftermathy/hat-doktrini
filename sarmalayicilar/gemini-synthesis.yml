# Sarmalayıcı — iş `Aftermathy/hat-doktrini`de.
#
# Bu dosya `hat-doktrini/sarmalayicilar/` altından kopyalandı.
#
# Bu dosya yalnız tetikleyiciyi ve izinleri taşıyor; iş akışının kendisi
# merkezde ve birden çok proje onu paylaşıyor. Merkez değişince buraya
# dokunmak gerekmiyor — sürüm etiketi (`@v1`) yükseltilene kadar bu proje
# aynı sürümde kalıyor.
#
# Tetikleyici burada durmak zorunda: GitHub `workflow_call` ile çağrılan
# dosyanın kendi tetikleyicisini okumuyor.
name: Gemini sentez

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Sentezlenecek issue numarası"
        required: true


permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: gemini-synthesis-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  cagir:
    uses: Aftermathy/hat-doktrini/.github/workflows/gemini-synthesis.yml@v1
    with:
      issue: ${{ inputs.issue }}
    secrets: inherit
